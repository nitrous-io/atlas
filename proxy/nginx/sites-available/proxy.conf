server {
    listen 80;
    listen 443 default_server ssl;
    listen 3000;
    listen 3001;
    listen 3002;
    listen 28080;

    ssl_certificate         /etc/ssl/container_proxy.crt;
    ssl_certificate_key     /etc/ssl/container_proxy.key;

    server_name *.nitrousapp.com;

    default_type text/html;

    location / {
        set $target '';
        resolver 8.8.8.8;

        # Lua files
        access_by_lua_file lualib/preview_proxy.lua;

        # Proxy configuration
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://$target$request_uri;
    }
    error_page 502 /error.html;
    location = /error.html {
        internal;
    }
}

server {
    listen 443;
    listen 65333;

    ssl on;
    ssl_certificate         /etc/ssl/host_proxy.crt;
    ssl_certificate_key     /etc/ssl/host_proxy.key;

    server_name *.nitrousproxy.com;

    default_type text/html;

    location / {
        set $target '';
        resolver 8.8.8.8;

        # Lua files
        access_by_lua_file lualib/freighter_proxy.lua;

        # Proxy configuration
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect  off;

        # Upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $scheme://$target$request_uri;
    }
}