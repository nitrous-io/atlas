server {
    listen 80;
    listen 443 default_server ssl;
    listen 3000;
    listen 3001;
    listen 3002;
    # Add more ports..

    ssl_certificate         /etc/ssl/container_proxy.crt;
    ssl_certificate_key     /etc/ssl/container_proxy.key;

    server_name *.nitrousapp.com;

    default_type text/html;

    location / {
        set $target '';
        resolver 8.8.8.8;

        # Lua files
        access_by_lua_file lualib/handle.lua;

        # Proxy configuration
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect  off;
#        proxy_redirect ~^(http://[^:]+):\d+(/.+)$ $2;
#        proxy_redirect / /;

        # Upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://$target$request_uri;
    }

    #error_page 502 @bad_gateway;
    #location @bad_gateway {
    #    # Proxy configuration
    #    proxy_set_header Host $http_host;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #    proxy_set_header  X-Real-IP  $remote_addr;
    #    proxy_set_header X-Forwarded-Proto $scheme;

    #    proxy_pass http://fallback;
    #}
}